openapi: 3.1.0
info:
  title: Lumen API
  version: 1.0.0
  summary: AI-powered accessibility platform — alt-text, ingest, review, export.
  description: |
    ## GA

    This API is generally available. The following are the stable integration
    surface:

    - **Idempotency keys** on `POST /v1/documents` (24h replay window) — the
      `Idempotency-Key` header is the only thing keeping a retried upload
      from creating a duplicate document.
    - **Webhooks** at `POST /v1/webhooks` — signed with HMAC-SHA256 using
      the per-endpoint `secret` returned once at creation. The
      `X-Lumen-Signature` header carries `t=<unix>,v1=<hex>`.
    - **Rate limits** — every endpoint advertises `X-RateLimit-*` headers
      and returns `429` with `Retry-After` when the per-org window is full.
    - **Compliance reports** — `GET /v1/exports/:id/report` returns a signed
      JSON compliance report; `GET /v1/exports/:id/vpat` returns a VPAT
      markdown summary.

servers:
  - url: http://localhost:4000
    description: Local dev
  - url: https://api.lumen.example/v1
    description: Production (placeholder — replace before launch)

tags:
  - name: Auth
  - name: Projects
  - name: Documents
  - name: Review
  - name: Exports
  - name: Metrics
  - name: Events
  - name: Webhooks
  - name: Usage

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lumen_session
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, maxLength: 255 }
      description: Replay-safe upload token; same key + same body returns the original response.
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        retryAfterSec: { type: integer, nullable: true }
    Webhook:
      type: object
      required: [id, url, events, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string, enum: ["*", "document.ingested", "export.completed"] }
        active: { type: boolean }
        secret:
          type: string
          description: Only present on the create response. Treat as a secret.
        createdAt: { type: string, format: date-time }

    SpotCheck:
      type: object
      required: [id, assetId, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string, nullable: true }
        imageClass: { type: string, nullable: true }
        status: { type: string, enum: [open, resolved] }
        decision: { type: string, enum: [approved, rejected], nullable: true }
        comment: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }

    Export:
      type: object
      required: [id, projectId, formats, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        formats:
          type: array
          items: { type: string, enum: [json, epub, xlsx, html, azw3, pdf] }
        status:
          type: string
          enum: [pending, running, completed, failed, validation_failed]
        artifactKeys:
          type: object
          description: format -> storage key; present once built
          additionalProperties: { type: string }
        createdAt: { type: string, format: date-time }

paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Email + password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: "Session issued (Set-Cookie: lumen_session)"
          headers:
            Set-Cookie:
              schema: { type: string }
        "401": { description: Invalid credentials, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /v1/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks for the caller's org
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhooks:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        "429": { $ref: "#/components/responses/RateLimited" }
    post:
      tags: [Webhooks]
      summary: Create a webhook endpoint
      description: |
        The signing `secret` is returned **only** on this response. Store it
        immediately — the server does not retain it in retrievable form.
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  description: Must be https:// or http://localhost.
                events:
                  type: array
                  items: { type: string, enum: ["*", "document.ingested", "export.completed"] }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  webhook: { $ref: "#/components/schemas/Webhook" }
                  eventTypes:
                    type: array
                    items: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhooks/{id}/test:
    post:
      tags: [Webhooks]
      summary: Queue a synthetic "ping" delivery
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "202": { description: Queued }
        "404": { description: Not found }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Delete a webhook endpoint
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/documents:
    post:
      tags: [Documents]
      summary: Upload a document (multipart)
      description: |
        Send the file as `multipart/form-data` with the field name `file`.
        Send an `Idempotency-Key` header to make the request replay-safe:
        the same key + same body within 24h returns the original document
        instead of creating a duplicate.
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                language:
                  type: string
                  enum: [en, es, fr, de, hi]
                  default: en
                  description: Alt-text output language (Phase 3 i18n). Optional — defaults to `en`.
                projectId:
                  type: string
                  format: uuid
      responses:
        "201": { description: Document accepted and queued for ingest }
        "400":
          description: Unsupported language code (`unsupported_language`)
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/projects/{id}/exports:
    post:
      tags: [Exports]
      summary: Request an export (review gate applies)
      description: |
        Builds artifacts from approved reviews only — every image in the
        project must be human-approved before an export is accepted.

        Formats: `json`, `epub`, `xlsx`, `html`, `azw3`.

        `azw3` (Kindle-ready, per decision D-1) is behind the `AZW3_ENABLED`
        feature flag: requests are rejected with `409 azw3_disabled` until
        the flag is on and a conversion tool is configured.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formats]
              properties:
                formats:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items:
                    type: string
                    enum: [json, epub, xlsx, html, azw3]
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  export: { $ref: "#/components/schemas/Export" }
        "409":
          description: |
            Either the review gate is open (`review_gate_open`) or the
            Kindle feature flag is off (`azw3_disabled`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [Exports]
      summary: List exports for a project (with validation rows)
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  exports:
                    type: array
                    items: { $ref: "#/components/schemas/Export" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/exports/{exportId}/artifact/{format}:
    get:
      tags: [Exports]
      summary: Download a built artifact
      description: Only available when the export status is `completed`.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: exportId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: format
          required: true
          schema:
            type: string
            enum: [json, epub, xlsx, html, azw3]
      responses:
        "200":
          description: Artifact bytes
          content:
            application/epub+zip: {}
            application/json: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
            text/html: {}
            application/x-mobipocket-ebook: {}
        "404": { description: Unknown export or format not built }

  /v1/exports/{exportId}/report:
    get:
      tags: [Exports]
      summary: Download the signed JSON compliance report for an export
      description: |
        The report is HMAC-SHA256 signed (see `X-Lumen-Report-Signature` header
        and the embedded `signature` object). Verify with the org's
        `REPORT_SIGNING_KEY` held out-of-band.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: exportId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Signed compliance report (review summary + validator outcomes)
          headers:
            X-Lumen-Report-Signature:
              schema: { type: string, description: "HMAC-SHA256 hex over the JSON body" }
          content:
            application/json: {}
        "404": { description: Unknown export }

  /v1/exports/{exportId}/vpat:
    get:
      tags: [Exports]
      summary: Download a VPAT-style compliance summary (Markdown)
      description: |
        Human-readable Voluntary Product Accessibility Template summary derived
        from the same data as the JSON compliance report. Downloadable as draft
        evidence for legal / procurement reviews.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: exportId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: VPAT summary (Markdown)
          content:
            text/markdown: {}
        "404": { description: Unknown export }

  /v1/projects/{id}/spot-checks:
    post:
      tags: [Review]
      summary: Open a senior spot-check batch for a ready-to-export project
      description: |
        Deterministically samples a fraction (`SPOT_CHECK_RATE`, default 0.1)
        of the project's approved assets and flags them for a senior second
        review. Safe to call repeatedly — the same assets get flagged, and
        already-open checks are never duplicated.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Batch created
          content:
            application/json:
              schema:
                type: object
                properties:
                  rate: { type: number }
                  eligible: { type: integer }
                  sampled: { type: integer }
                  created: { type: integer }
        "404": { description: Unknown project }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/spot-checks:
    get:
      tags: [Review]
      summary: List spot-checks for the org (default: open only)
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [open, all], default: open }
      responses:
        "200":
          description: Spot-check queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  rate: { type: number }
                  checks:
                    type: array
                    items: { $ref: "#/components/schemas/SpotCheck" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/spot-checks/{id}/decision:
    post:
      tags: [Review]
      summary: Resolve a spot-check with a senior decision
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                comment: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  check: { $ref: "#/components/schemas/SpotCheck" }
        "404": { description: Unknown spot-check }
        "409": { description: Already resolved }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/org/usage:
    get:
      tags: [Usage]
      summary: Aggregate the org's usage ledger over a window
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: |
            Totals by kind plus the calendar-month vision-call count and the
            configured alert threshold (`0` = spend alerts disabled).
          content:
            application/json:
              schema:
                type: object
                properties:
                  windowDays: { type: integer }
                  since: { type: string, format: date-time }
                  totals:
                    type: object
                    properties:
                      vision_calls: { type: integer }
                      export_artifacts: { type: integer }
                      webhook_deliveries: { type: integer }
                  monthlyVisionCalls: { type: integer }
                  alertThreshold: { type: integer }
                  byKind:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        units: { type: integer }
                        events: { type: integer }

responses:
  RateLimited:
    description: Per-org rate limit exceeded
    headers:
      Retry-After:
        schema: { type: integer }
      X-RateLimit-Remaining:
        schema: { type: integer }
      X-RateLimit-Reset:
        schema: { type: integer }
    content:
      application/json:
        schema: { $ref: "#/components/schemas/Error" }
