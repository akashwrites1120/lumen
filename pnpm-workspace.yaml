packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  # protobufjs postinstall only generates optional dev artifacts; OTel's
  # otlp-transformer ships prebuilt protobuf sources and works without it.
  protobufjs: false

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
  - bcrypt
  - msgpackr-extract
