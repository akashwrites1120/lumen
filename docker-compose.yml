services:
  postgres:
    image: postgres:17-alpine
    container_name: lumen-postgres
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - lumen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: lumen-redis
    ports:
      - "6379:6379"
    volumes:
      - lumen-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # EPUB validator sidecar — enable with:
  #   docker compose --profile validators up -d --build
  # then point workers at it via EPUBCHECK_URL=http://localhost:4010
  validator-epubcheck:
    build:
      context: ./docker/validator-epubcheck
      args:
        EPUBCHECK_VERSION: "5.1.0"
    image: lumen/validator-epubcheck
    container_name: lumen-validator-epubcheck
    profiles: ["validators"]
    ports:
      - "4010:4010"
    mem_limit: 512m

  # DAISY Ace sidecar — requires the Ace bundle (see docker/validator-ace/Dockerfile):
  #   docker compose --profile validators build --build-arg ACE_BUNDLE_URL=<url> validator-ace
  validator-ace:
    build:
      context: ./docker/validator-ace
      args:
        ACE_BUNDLE_URL: ""
    image: lumen/validator-ace
    container_name: lumen-validator-ace
    profiles: ["validators"]
    ports:
      - "4011:4011"
    mem_limit: 1g

  # Kindle (AZW3) conversion sidecar (Calibre ebook-convert) — enable with:
  #   docker compose --profile converters up -d --build
  # then set AZW3_ENABLED=true and AZW3_CONVERT_URL=http://localhost:4012
  export-azw3:
    build:
      context: ./docker/export-azw3
    image: lumen/export-azw3
    container_name: lumen-export-azw3
    profiles: ["converters"]
    ports:
      - "4012:4012"
    mem_limit: 1g

  # S3-compatible object storage for local dev (STORAGE_DRIVER=s3)
  minio:
    image: minio/minio:latest
    container_name: lumen-minio
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lumen
      MINIO_ROOT_PASSWORD: lumen-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lumen-miniodata:/data

volumes:
  lumen-pgdata:
  lumen-redisdata:
  lumen-miniodata:
