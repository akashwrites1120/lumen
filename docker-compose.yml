services:
  postgres:
    image: postgres:17-alpine
    container_name: lumen-postgres
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    ports:
      - "5432:5432"
    volumes:
      - lumen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: lumen-redis
    ports:
      - "6379:6379"
    volumes:
      - lumen-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # EPUB validator sidecar — enable with:
  #   docker compose --profile validators up -d --build
  # then point workers at it via EPUBCHECK_URL=http://localhost:4010
  validator-epubcheck:
    build:
      context: ./docker/validator-epubcheck
      args:
        EPUBCHECK_VERSION: "5.1.0"
    image: lumen/validator-epubcheck
    container_name: lumen-validator-epubcheck
    profiles: ["validators"]
    ports:
      - "4010:4010"
    mem_limit: 512m

volumes:
  lumen-pgdata:
  lumen-redisdata:
